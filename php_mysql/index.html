<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Exam Duty Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #EFF6FF 0%, #F8FAFC 100%);
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      padding: 36px 32px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-brand-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 24px;
      margin: 0 auto 14px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }
    .hint-card {
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #1E3A8A;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-brand-icon">⏱️</div>
        <h1 style="font-size: 22px; font-weight: 800; color: #0F172A; margin-bottom: 4px;">Exam Duty Portal</h1>
        <p style="font-size: 13.5px; color: #64748B;">Sign in to access your duty roster & assignments</p>
      </div>

      <!-- Quick Admin Referral Hint -->
      <div class="hint-card">
        <span style="font-size: 16px;">💡</span>
        <div>
          <strong style="color: #1D4ED8;">Admin Demo Login Hint:</strong><br>
          Mobile: <strong>9876543210</strong> &bull; Resource ID: <strong>17655</strong>
        </div>
      </div>

      <div id="loginAlert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="mobile">Registered Mobile Number *</label>
          <input 
            type="tel" 
            id="mobile" 
            class="form-control" 
            placeholder="e.g. 9876543210" 
            required 
            maxlength="10"
            pattern="[0-9]{10}"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="resourceId">Resource ID / Staff ID *</label>
          <input 
            type="text" 
            id="resourceId" 
            class="form-control" 
            placeholder="e.g. 17655 or 597299" 
            required
          >
        </div>

        <div style="margin-top: 24px;">
          <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; height: 46px; font-size: 15px;">
            <span>Sign In to Portal</span>
            <span>➔</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // If already logged in, redirect to dashboard
    if (App.getUser()) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      App.clearAlert('loginAlert');

      const mobile = document.getElementById('mobile').value.trim();
      const resourceId = document.getElementById('resourceId').value.trim();
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.textContent = 'Verifying credentials...';

      try {
        const response = await fetch('api/auth/login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mobile, resourceId })
        });

        const data = await response.json();

        if (data.success && data.user) {
          App.setUser(data.user);
          window.location.href = 'dashboard.html';
        } else {
          App.showAlert('loginAlert', data.message || 'Invalid credentials.');
          btn.disabled = false;
          btn.innerHTML = '<span>Sign In to Portal</span> <span>➔</span>';
        }
      } catch (err) {
        console.error(err);
        App.showAlert('loginAlert', 'Failed to connect to backend server. Please verify PHP & MySQL are running.');
        btn.disabled = false;
        btn.innerHTML = '<span>Sign In to Portal</span> <span>➔</span>';
      }
    });
  </script>
</body>
</html>
